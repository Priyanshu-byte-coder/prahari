services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinel
      MINIO_ROOT_PASSWORD: sentinel_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    image: osrm/osrm-backend:latest
    container_name: sentinel-osrm
    restart: unless-stopped
    # ponytail: no Gujarat OSM extract processed yet -- D6 owns building
    # data/osrm/gujarat.osrm via osrm-extract + osrm-contract before this
    # container has anything to serve. Until then `make up` brings the
    # container up but route snapping (D6) has nothing to query.
    command: osrm-routed --algorithm mld /data/gujarat.osrm
    ports:
      - "5000:5000"
    volumes:
      - ../data/osrm:/data
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  minio_data:
