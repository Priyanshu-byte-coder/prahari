<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prahari — Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">

  <nav class="rail">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5 4 5.6v6.1c0 4.9 3.3 8.4 8 9.8 4.7-1.4 8-4.9 8-9.8V5.6L12 2.5Z"></path>
        <circle cx="12" cy="11" r="2.6"></circle>
        <path d="M6.6 11c1.6-2.6 3.4-3.9 5.4-3.9s3.8 1.3 5.4 3.9c-1.6 2.6-3.4 3.9-5.4 3.9S8.2 13.6 6.6 11Z"></path>
      </svg>
    </div>

    <a href="#map" data-nav="map">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6 9 3Z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg>
      <span>Map</span>
    </a>
    <a href="#wall" data-nav="wall">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="7" rx="1.5"></rect><rect x="13" y="4" width="8" height="7" rx="1.5"></rect><rect x="3" y="13" width="8" height="7" rx="1.5"></rect><rect x="13" y="13" width="8" height="7" rx="1.5"></rect></svg>
      <span>Wall</span>
    </a>
    <a href="#trace" data-nav="trace">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c4.5 0 3.5-6 8-6s3.5-6 8-6"></path><circle cx="4" cy="18" r="2.2"></circle><circle cx="20" cy="6" r="2.2"></circle></svg>
      <span>Trace</span>
    </a>
    <a href="#alerts" data-nav="alerts">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v5.5c0 4.6 3.2 7.8 8 9 4.8-1.2 8-4.4 8-9V6l-8-3Z"></path><path d="M12 8.5v4"></path><path d="M12 16h.01"></path></svg>
      <span>Alerts</span>
      <em class="badge" id="alertBadge" style="display:none;font-style:normal">0</em>
    </a>
    <a href="#watchlist" data-nav="watchlist">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"></path><path d="M4 12h9"></path><path d="M4 17h6"></path><path d="m15.5 16.5 2 2 4-4"></path></svg>
      <span>Watch</span>
    </a>
    <a href="#admin" data-nav="admin">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8"></path><path d="M15 7h6"></path><circle cx="13" cy="7" r="2.2"></circle><path d="M3 17h5"></path><path d="M12 17h9"></path><circle cx="10" cy="17" r="2.2"></circle></svg>
      <span>Admin</span>
    </a>

    <div class="grow"></div>
    <div class="me" title="Console account">PR</div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:baseline;gap:12px">
        <h1 id="viewTitle">Live map</h1>
        <span class="sub" id="viewSub">grid overview</span>
      </div>
      <div class="grow"></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#68807F" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
        <input id="globalSearch" placeholder="Plate, camera, case" autocomplete="off">
        <span class="kbd">/</span>
      </div>
      <div class="pill">
        <span class="live-dot"><i class="ping"></i><b></b></span>
        <span id="healthPill">— / — live</span>
      </div>
    </header>

    <div id="views"></div>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
