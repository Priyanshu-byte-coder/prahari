# ByteTrack tuned for CCTV traffic, not the ultralytics default.
#
# Default track_buffer is 30 frames. On this grid's traffic footage vehicles
# are frequently occluded for longer than that by other vehicles, poles and
# signage at junction cameras -- the tracker was dropping the track and
# handing the same physical vehicle a new id on reappearance, which silently
# inflated "unique vehicle" counts. Raised to 90 frames (~3-6s depending on
# the camera's measured fps) so a brief occlusion doesn't look like a new car.
tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 90
match_thresh: 0.8
fuse_score: True
